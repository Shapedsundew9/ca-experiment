<text x="629" y="364" font-size="11" fill="#94a3b8" font-family="monospace">• Periodic Closure: Node (x, y) coordinates wrap modulo 4.</text>
<text x="629" y="386" font-size="11" fill="#94a3b8" font-family="monospace">• Graph Regularity: Every node has exactly 4 incoming and 4 outgoing tracks.</text>
<text x="629" y="408" font-size="11" fill="#94a3b8" font-family="monospace">• Total Transmission Capacity: 4 * 16 = 64 directed bit channels.</text>
<text x="629" y="430" font-size="11" fill="#94a3b8" font-family="monospace">• Topological Diameter: D_diam = 2 + 2 = 4 (Max Manhattan distance).</text>
<text x="629" y="452" font-size="11" fill="#94a3b8" font-family="monospace">• Boundary Invariant: Zero edge reflections or boundary damping.</text>
