<text x="100" y="314" font-size="10" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-weight="bold">P₀</text>
<circle cx="100" cy="195" r="16" fill="#222738" stroke="#61afef" stroke-width="1.5" />
<text x="100" y="199" font-size="10" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-weight="bold">P₁</text>
