<text x="395" y="198" font-size="9" text-anchor="middle" fill="#61afef" font-family="monospace" font-weight="bold">R1,[</text>
<path d="M89,292 L89,213" stroke="#e5c07b" stroke-width="1.5" marker-end="url(#d3)" />
