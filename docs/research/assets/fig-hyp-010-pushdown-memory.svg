<text x="118" y="255.5" font-size="8" text-anchor="middle" fill="#e06c75" font-family="sans-serif" font-weight="bold">POP</text>
<rect x="45" y="385" width="475" height="65" rx="6" ry="6" fill="#1c2130" stroke="#434c5e" stroke-width="1.0" />
<text x="54" y="403" font-size="10" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">Token Ingress Demultiplexing Ports (Cadence $T_{\text{token}} = 16$ ticks)</text>
<rect x="55" y="417" width="90" height="24" rx="4" ry="4" fill="#13161f" stroke="#73c991" stroke-width="1.2" />
<text x="100" y="432" font-size="8" text-anchor="middle" fill="#73c991" font-family="monospace" font-weight="bold">$v_{(}$ : PUSH '('</text>
<rect x="175" y="417" width="90" height="24" rx="4" ry="4" fill="#13161f" stroke="#61afef" stroke-width="1.2" />
<text x="220" y="432" font-size="8" text-anchor="middle" fill="#61afef" font-family="monospace" font-weight="bold">$v_{[}$ : PUSH '['</text>
<rect x="295" y="417" width="90" height="24" rx="4" ry="4" fill="#13161f" stroke="#e06c75" stroke-width="1.2" />
<text x="340" y="432" font-size="8" text-anchor="middle" fill="#e06c75" font-family="monospace" font-weight="bold">$v_{)}$ : POP ')'</text>
<rect x="405" y="417" width="90" height="24" rx="4" ry="4" fill="#13161f" stroke="#e5c07b" stroke-width="1.2" />
<text x="450" y="432" font-size="8" text-anchor="middle" fill="#e5c07b" font-family="monospace" font-weight="bold">$v_{]}$ : POP ']'</text>
<rect x="45" y="475" width="475" height="165" rx="6" ry="6" fill="#13161f" stroke="#434c5e" stroke-width="1.0" />
<text x="54" y="493" font-size="10" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">Coincidence Gating &amp; Violation Detection Subsystem</text>
<rect x="60" y="511" width="180" height="48" rx="5" ry="5" fill="#1e2230" stroke="#73c991" stroke-width="1.2" />
<text x="150" y="527" font-size="9" text-anchor="middle" fill="#73c991" font-family="sans-serif" font-weight="bold">PUSH Gate $G_{\text{push},k}$</text>
<text x="150" y="541" font-size="8" text-anchor="middle" fill="#94a3b8" font-family="monospace">Pₖ ∧ $v_{\text{open}}$ (W=0.6, θ=1.10)</text>
<text x="150" y="553" font-size="8" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif">Sets Cₖ &amp; Advances Pₖ → Pₖ₊₁</text>
<rect x="285" y="511" width="180" height="48" rx="5" ry="5" fill="#1e2230" stroke="#61afef" stroke-width="1.2" />
<text x="375" y="527" font-size="9" text-anchor="middle" fill="#61afef" font-family="sans-serif" font-weight="bold">POP Match Gate $G_{\text{pop},k}$</text>
<text x="375" y="541" font-size="8" text-anchor="middle" fill="#94a3b8" font-family="monospace">Pₖ ∧ Cₖ₋₁ ∧ $v_{\text{close}}$ (3-Way θ=1.1)</text>
<text x="375" y="553" font-size="8" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif">Quenches Cₖ₋₁ &amp; Drops Pₖ → Pₖ₋₁</text>
<rect x="55" y="590" width="205" height="36" rx="4" ry="4" fill="#2e1a1e" stroke="#e06c75" stroke-width="1.2" />
<text x="157" y="605" font-size="8" text-anchor="middle" fill="#e06c75" font-family="sans-serif" font-weight="bold">Underflow / Mismatch Trap $v_{\text{trap}}$</text>
<text x="157" y="618" font-size="8" text-anchor="middle" fill="#94a3b8" font-family="monospace">Absorbing Attractor $A_{\text{reject}}$</text>
<rect x="275" y="590" width="215" height="36" rx="4" ry="4" fill="#1a2e22" stroke="#73c991" stroke-width="1.2" />
<text x="382" y="605" font-size="8" text-anchor="middle" fill="#73c991" font-family="sans-serif" font-weight="bold">Acceptance Readout $v_{\text{accept}}$</text>
<text x="382" y="618" font-size="8" text-anchor="middle" fill="#94a3b8" font-family="monospace">Empty Stack (P₀) ∧ $v_{\text{eos}}$ → $A_{\text{accept}}$</text>
<rect x="570" y="75" width="540" height="600" rx="8" ry="8" fill="#1e2230" stroke="#434c5e" stroke-width="1.0" />
<text x="586" y="101" font-size="15" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">Dynamical Phase Space &amp; LIFO Trajectory</text>
<text x="586" y="119" font-size="11" fill="#94a3b8" font-family="sans-serif">Trace of Stack Evolution for Valid vs Mismatched Streams</text>
<rect x="585" y="130" width="510" height="220" rx="6" ry="6" fill="#13161f" stroke="#434c5e" stroke-width="1.0" />
<text x="595" y="148" font-size="10" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">Step-by-Step Dyck-2 LIFO Trace: Sequence '[' '(' ')' ']'</text>
<text x="595" y="169" font-size="8.5" fill="#94a3b8" font-family="monospace">t = 0</text>
<text x="655" y="169" font-size="8.5" fill="#73c991" font-family="monospace" font-weight="bold">Initial Ground</text>
<text x="775" y="169" font-size="8.5" fill="#e2e8f0" font-family="sans-serif">Stack: [] (Empty)</text>
<text x="930" y="169" font-size="8" fill="#94a3b8" font-family="sans-serif">Pointer: P₀ active</text>
<path d="M590,178 L1075,178" stroke="#33394a" stroke-width="0.8" stroke-dasharray="2,2" />
<text x="595" y="199" font-size="8.5" fill="#94a3b8" font-family="monospace">t = 16</text>
<text x="655" y="199" font-size="8.5" fill="#61afef" font-family="monospace" font-weight="bold">Token 1: '['</text>
<text x="775" y="199" font-size="8.5" fill="#e2e8f0" font-family="sans-serif">PUSH '[', C₀ holds '['</text>
<text x="930" y="199" font-size="8" fill="#94a3b8" font-family="sans-serif">P₀ → P₁ active</text>
<path d="M590,208 L1075,208" stroke="#33394a" stroke-width="0.8" stroke-dasharray="2,2" />
<text x="595" y="229" font-size="8.5" fill="#94a3b8" font-family="monospace">t = 32</text>
<text x="655" y="229" font-size="8.5" fill="#61afef" font-family="monospace" font-weight="bold">Token 2: '('</text>
<text x="775" y="229" font-size="8.5" fill="#e2e8f0" font-family="sans-serif">PUSH '(', C₁ holds '('</text>
<text x="930" y="229" font-size="8" fill="#94a3b8" font-family="sans-serif">P₁ → P₂ active</text>
<path d="M590,238 L1075,238" stroke="#33394a" stroke-width="0.8" stroke-dasharray="2,2" />
<text x="595" y="259" font-size="8.5" fill="#94a3b8" font-family="monospace">t = 48</text>
<text x="655" y="259" font-size="8.5" fill="#73c991" font-family="monospace" font-weight="bold">Token 3: ')'</text>
<text x="775" y="259" font-size="8.5" fill="#e2e8f0" font-family="sans-serif">POP ')': Matches C₁ '(', quench C₁</text>
<text x="930" y="259" font-size="8" fill="#94a3b8" font-family="sans-serif">P₂ → P₁ active</text>
<path d="M590,268 L1075,268" stroke="#33394a" stroke-width="0.8" stroke-dasharray="2,2" />
<text x="595" y="289" font-size="8.5" fill="#94a3b8" font-family="monospace">t = 64</text>
<text x="655" y="289" font-size="8.5" fill="#73c991" font-family="monospace" font-weight="bold">Token 4: ']'</text>
<text x="775" y="289" font-size="8.5" fill="#e2e8f0" font-family="sans-serif">POP ']': Matches C₀ '[', quench C₀</text>
<text x="930" y="289" font-size="8" fill="#94a3b8" font-family="sans-serif">P₁ → P₀ active</text>
<path d="M590,298 L1075,298" stroke="#33394a" stroke-width="0.8" stroke-dasharray="2,2" />
<text x="595" y="319" font-size="8.5" fill="#94a3b8" font-family="monospace">t = 80</text>
<text x="655" y="319" font-size="8.5" fill="#e5c07b" font-family="monospace" font-weight="bold">EOS Probe</text>
<text x="775" y="319" font-size="8.5" fill="#e2e8f0" font-family="sans-serif">P₀ active ∧ Zero Traps → FIRE</text>
<text x="930" y="319" font-size="8" fill="#94a3b8" font-family="sans-serif">State: $A_{\text{acc}}$ (1.0)</text>
<rect x="585" y="360" width="510" height="100" rx="6" ry="6" fill="#20151a" stroke="#e06c75" stroke-width="1.0" />
<text x="595" y="378" font-size="10" fill="#e06c75" font-family="sans-serif" font-weight="bold">Cross-Bracket Violation Trap: Sequence '[' '(' ']' ')' (Non-LIFO)</text>
<text x="595" y="398" font-size="8.5" fill="#e2e8f0" font-family="sans-serif">1. Tokens '[' then '(' arrive → Stack: Depth 2 (Pointer P₂ active).</text>
<text x="595" y="416" font-size="8.5" fill="#e2e8f0" font-family="sans-serif">2. Token ']' arrives at t=48: Top C₁ holds '(', mismatch with token ']'.</text>
<text x="595" y="434" font-size="8.5" fill="#e06c75" font-family="sans-serif" font-weight="bold">3. Mismatch: (P₂ ∧ C₁,( ∧ $v_{]}$) = 1.20 ≥ 1.10 → $v_{\text{trap}}$ fires.</text>
<text x="595" y="452" font-size="8.5" fill="#94a3b8" font-family="sans-serif">4. $v_{\text{trap}}$ enters trap loop, quenching $v_{\text{accept}}$.</text>
<rect x="585" y="470" width="510" height="220" rx="6" ry="6" fill="#13161f" stroke="#434c5e" stroke-width="1.0" />
<text x="599" y="490" font-size="12" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">Mathematical &amp; Architectural Invariants</text>
<text x="599" y="512" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Bounded Degree:</text>
<text x="599" y="527" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   $k_{\text{in}}, k_{\text{out}} \le 4$ via modular 1D tiling.</text>
<text x="599" y="546" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Modular Depth Scaling:</text>
<text x="599" y="561" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   Calibrated on $D \le 4$; scales to $D \in [1, 8]$ with zero</text>
<text x="599" y="576" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   retuning.</text>
<text x="599" y="595" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Refractory Diode Shielding:</text>
<text x="599" y="610" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   $N_{\text{ref}} = 2$ prevents standing waves and retrograde</text>
<text x="599" y="625" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   crosstalk.</text>
<text x="599" y="644" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Homeostatic Criticality:</text>
<text x="599" y="659" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   Dynamic threshold adaptation bounds $\rho \in [0.01, 0.25]$.</text>
