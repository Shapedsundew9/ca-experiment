<text x="255" y="313" font-size="9" text-anchor="middle" fill="#73c991" font-family="monospace" font-weight="bold">R0,(</text>
<circle cx="395" cy="310" r="15" fill="#222738" stroke="#73c991" stroke-width="1.5" />
<text x="395" y="313" font-size="9" text-anchor="middle" fill="#73c991" font-family="monospace" font-weight="bold">R0,[</text>
<circle cx="255" cy="195" r="15" fill="#222738" stroke="#61afef" stroke-width="1.5" />
<text x="255" y="198" font-size="9" text-anchor="middle" fill="#61afef" font-family="monospace" font-weight="bold">R1,(</text>
