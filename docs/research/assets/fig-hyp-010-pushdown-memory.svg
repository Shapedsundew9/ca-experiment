<text x="415" y="198" font-size="9" text-anchor="middle" fill="#61afef" font-family="monospace" font-weight="bold">R1,[</text>
<path d="M94,292 L94,213" stroke="#e5c07b" stroke-width="1.5" marker-end="url(#d3)" />
<text x="80" y="255.5" font-size="8" text-anchor="middle" fill="#e5c07b" font-family="sans-serif" font-weight="bold">PUSH</text>
