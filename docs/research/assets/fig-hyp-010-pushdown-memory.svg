<text x="46" y="101" font-size="15" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">Substrate Circuit: Modular Pushdown Ladder</text>
<text x="46" y="119" font-size="11" fill="#94a3b8" font-family="sans-serif">Cascaded Latch Units C_k &amp; Bidirectional Pointer P_k</text>
<rect x="45" y="140" width="445" height="100" rx="6" ry="6" fill="#13161f" stroke="#61afef" stroke-width="1.0" stroke-dasharray="3,3" />
<text x="54" y="156" font-size="10" fill="#61afef" font-family="sans-serif" font-weight="bold">Stack Frame k = 1 (Depth 1 Storage)</text>
