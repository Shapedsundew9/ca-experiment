<text x="54" y="271" font-size="10" fill="#73c991" font-family="sans-serif" font-weight="bold">Stack Frame k = 0 (Depth 0 Storage)</text>
<circle cx="95" cy="310" r="16" fill="#1b3528" stroke="#73c991" stroke-width="1.5" />
<text x="95" y="314" font-size="10" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-weight="bold">P_0</text>
