<text x="570.0" y="34" font-size="20" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">Cascaded Dynamical Stack Substrate for Pushdown Automata &amp; Dyck Languages</text>
<text x="570.0" y="56" font-size="12" text-anchor="middle" fill="#94a3b8" font-family="monospace">Substrate Dynamics: Modular Resonant Latch Frames, Bidirectional Pointer Steering, and Coincidence Gating (degree ≤ 4)</text>
