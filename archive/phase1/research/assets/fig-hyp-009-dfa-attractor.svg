<text x="569" y="340" font-size="12" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">DFA Substrate Invariants &amp; Boundary Constraints</text>
<text x="569" y="362" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Mutual Exclusivity Invariant</text>
<text x="569" y="377" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   Σ 𝕀(Ring-j active) ≡ 1 at all settled ticks</text>
<text x="569" y="392" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   (zero crosstalk).</text>
<text x="569" y="411" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Causal Transition Settling</text>
<text x="569" y="426" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   Inter-token window T-token ≥ τ-trans + P-ring</text>
<text x="569" y="441" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   = 4 + 4 = 8 ticks.</text>
<text x="569" y="460" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Refractory Diode Shielding</text>
<text x="569" y="475" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   N-ref = 2 prevents retrograde reflections &amp;</text>
<text x="569" y="490" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   standing waves.</text>
<text x="569" y="509" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Instantaneous Quenching</text>
<text x="569" y="524" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   W-inh = -1.50 guarantees single-tick phase-</text>
<text x="569" y="539" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   invariant reset.</text>
<text x="569" y="558" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Thermal Noise Immunity</text>
<text x="569" y="573" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   Dynamic adaptation (β-θ = 0.05, θ ≥ 1.02)</text>
<text x="569" y="588" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   suppresses percolation.</text>
