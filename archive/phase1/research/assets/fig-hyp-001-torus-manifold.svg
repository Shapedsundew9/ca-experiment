<text x="808.5" y="205" font-size="16" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif">See companion 3D render:</text>
<text x="808.5" y="235" font-size="18" text-anchor="middle" fill="#61afef" font-family="monospace" font-weight="bold">fig-hyp-001-torus-3d.png</text>
<rect x="612" y="345" width="393" height="297.0" rx="6" ry="6" fill="#161922" stroke="#434c5e" stroke-width="1.0" />
<text x="626" y="365" font-size="12" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">Toroidal Substrate Invariants</text>
<text x="626" y="387" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Periodic Closure</text>
<text x="626" y="402" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   Node coordinates (x, y) wrap modulo 4 across</text>
<text x="626" y="417" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   boundaries.</text>
<text x="626" y="436" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Graph Regularity</text>
<text x="626" y="451" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   Every node has exactly 4 incoming and 4</text>
<text x="626" y="466" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   outgoing tracks.</text>
<text x="626" y="485" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Transmission Channels</text>
<text x="626" y="500" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   64 directed bit tracks with unit delay</text>
<text x="626" y="515" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   (latency τ = 1).</text>
<text x="626" y="534" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Topological Diameter</text>
<text x="626" y="549" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   D = 2 + 2 = 4 (Maximum Manhattan graph</text>
<text x="626" y="564" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   distance).</text>
<text x="626" y="583" font-size="11.0" fill="#e2e8f0" font-family="sans-serif" font-weight="bold">• Boundary Invariant</text>
<text x="626" y="598" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   Zero edge reflections or artificial boundary</text>
<text x="626" y="613" font-size="10.5" fill="#94a3b8" font-family="sans-serif">   damping.</text>
<text x="520.0" y="685.0" font-size="10" text-anchor="middle" fill="#94a3b8" font-family="monospace">Figure FIG-HYP-001 | ca-experiment | Generated via python/scripts/figures/fig_hyp_001_torus_manifold.py</text>
